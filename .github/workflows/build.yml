name: Build desktop releases

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-latest
            binary: target/release/meemuttaja
            asset: meemuttaja-macos-arm64.tar.gz
            package: tar
          - name: Windows x64
            runner: windows-latest
            binary: target/release/meemuttaja.exe
            asset: meemuttaja-windows-x64.exe
            package: copy
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build release binary
        run: cargo build --release --locked
      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ '${{ matrix.package }}' = tar ]; then
            tar -czf '${{ matrix.asset }}' -C target/release meemuttaja
          else
            cp '${{ matrix.binary }}' '${{ matrix.asset }}'
          fi
          gh release upload "$RELEASE_TAG" '${{ matrix.asset }}' --clobber
